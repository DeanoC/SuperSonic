# Retained HIP/Qwen3.8 kernel groups. Unsupported backends and model families
# are intentionally absent from this manifest.

version = 1

[[group]]
id = "hip-qwen38-dense"
backend = "hip"
model_family = "qwen3.8"
default_compiled = true
notes = "Retained Qwen3.8 dense attention, 4B geometry, and prefill helpers."
kernel_sources = [
  "kernels/full_attention.hip",
  "kernels/full_attention_4b.hip",
  "kernels/prefill_helpers.hip",
]
rust_modules = [
  "crates/kernel-ffi/src/qwen35.rs",
  "crates/kernel-ffi/src/prefill_ffi.rs",
]

[[group.bridge]]
source = "kernels/full_attention_bridge.cpp"
object = "qwen35_megakernel_hip.o"

[[group.bridge]]
source = "kernels/full_attention_bridge_4b.cpp"
object = "qwen35_4b_megakernel_hip.o"

[[group.bridge]]
source = "kernels/prefill_helpers_bridge.cpp"
object = "qwen35_prefill_helpers_hip.o"

[[group]]
id = "hip-gqh"
backend = "hip"
model_family = "qwen3.8-gqh"
default_compiled = true
notes = "Qwen3.8 GQH decode and fused dequant-matvec."
kernel_sources = [
  "kernels/gqh.hip",
  "kernels/gqh-tables.h",
]
rust_modules = [
  "crates/kernel-ffi/src/gqh.rs",
]

[[group.bridge]]
source = "kernels/gqh_bridge.cpp"
object = "gqh_hip.o"
