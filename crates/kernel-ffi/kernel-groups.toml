# Authoritative HIP kernel inputs for the Qwen3.8-27B GQH product path.
# Unsupported backends and model families are intentionally absent.

version = 1

[[group]]
id = "hip-qwen38-dense"
backend = "hip"
model_family = "qwen3.8"
default_compiled = true
notes = "Qwen3.8-27B dense attention, 4B geometry, and prefill helpers."
kernel_sources = [
  "kernels/full_attention.hip",
  "kernels/full_attention_4b.hip",
  "kernels/prefill_helpers.hip",
]
rust_modules = [
  "crates/kernel-ffi/src/qwen38.rs",
  "crates/kernel-ffi/src/prefill_ffi.rs",
]

[[group.bridge]]
source = "kernels/full_attention_bridge.cpp"
# Historical bridge object name retained for link/ABI compatibility.
object = "qwen35_megakernel_hip.o"

[[group.bridge]]
source = "kernels/full_attention_bridge_4b.cpp"
# Historical bridge object name retained for link/ABI compatibility.
object = "qwen35_4b_megakernel_hip.o"

[[group.bridge]]
source = "kernels/prefill_helpers_bridge.cpp"
# Historical bridge object name retained for link/ABI compatibility.
object = "qwen35_prefill_helpers_hip.o"

[[group]]
id = "hip-gqh"
backend = "hip"
model_family = "qwen3.8-27b-gqh"
default_compiled = true
notes = "Qwen3.8-27B GQH decode and fused dequant-matvec."
kernel_sources = [
  "kernels/gqh.hip",
  "kernels/gqh-tables.h",
  "kernels/gqh-stride.h",
]
rust_modules = [
  "crates/kernel-ffi/src/gqh.rs",
]

[[group.bridge]]
source = "kernels/gqh_bridge.cpp"
object = "gqh_hip.o"

[[group]]
id = "metal-qwen38-scaffold"
backend = "metal"
model_family = "qwen3.8"
default_compiled = true
notes = "Metal scaffold: shader smoke test, device query, and HIP ABI link stubs."
kernel_sources = [
  "kernels/metal/scaffold.metal",
  "kernels/metal/prefill.metal",
  "kernels/metal/prefill_attention.metal",
  "kernels/metal/prefill_quant.metal",
]
native_sources = [
  "kernels/metal/scaffold_bridge.mm",
  "kernels/metal/metal_dispatch.mm",
  "kernels/metal/prefill_bridge.mm",
  "kernels/metal/prefill_bridge_rest.mm",
  "kernels/metal/gqh_bridge.mm",
  "kernels/metal/decode_bridge.mm",
  "kernels/metal/hip_symbol_stubs.cc",
]
rust_modules = [
  "crates/kernel-ffi/src/qwen38.rs",
  "crates/kernel-ffi/src/prefill_ffi.rs",
  "crates/kernel-ffi/src/gqh.rs",
]
