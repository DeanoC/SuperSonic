[package]
name = "supersonic-runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "supersonic_runtime"
path = "src/lib.rs"

[features]
default = []
scalar-head-lab = []

[dependencies]
gpu-hal = { path = "../gpu-hal" }
kernel-ffi = { path = "../kernel-ffi" }
qwen38 = { path = "../qwen38" }

anyhow = "1"
base64 = "0.22"
half = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"
minijinja = { version = "2", features = ["json", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }
