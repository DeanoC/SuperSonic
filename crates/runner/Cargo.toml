[package]
name = "runner"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []

[[bin]]
name = "supersonic"
path = "src/main.rs"

[dependencies]
supersonic-runtime = { path = "../runtime" }
supersonic-core = { path = "../core" }
gpu-hal = { path = "../gpu-hal" }
kernel-ffi = { path = "../kernel-ffi" }
model-store = { path = "../model-store" }
qwen35 = { path = "../qwen35" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"

[dev-dependencies]
tempfile = "3"
