[package]
name = "runner"
version = "0.1.0"
edition = "2021"
autobins = false

[features]
default = []

[[bin]]
name = "supersonic"
path = "src/main.rs"

[[bin]]
name = "int4_test"
path = "src/bin/int4_test.rs"

[[bin]]
name = "int4_real_test"
path = "src/bin/int4_real_test.rs"

[[bin]]
name = "bench_prefill_attn"
path = "src/bin/bench_prefill_attn.rs"

[[bin]]
name = "qwen36_ffn_expert_microbench"
path = "src/bin/qwen36_ffn_expert_microbench.rs"

[[bin]]
name = "qwen36_flm_upload_probe"
path = "src/bin/qwen36_flm_upload_probe.rs"

[[bin]]
name = "qwen36_q4km_manifest_audit"
path = "src/bin/qwen36_q4km_manifest_audit.rs"

[dependencies]
machine-profile = { path = "../machine-profile" }
supersonic-runtime = { path = "../runtime" }
supersonic-core = { path = "../core" }
gpu-hal = { path = "../gpu-hal" }
kernel-ffi = { path = "../kernel-ffi" }
model-store = { path = "../model-store" }
qwen35 = { path = "../qwen35" }
qwen35_dflash = { path = "../qwen35_dflash" }
qwen36_moe = { path = "../qwen36_moe" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokenizers = "0.22"
base64 = "0.22"
half = "2.4"
safetensors = "0.5"
memmap2 = "0.9"

[dev-dependencies]
tempfile = "3"
