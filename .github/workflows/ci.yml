name: CPU CI

on:
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - ".github/workflows/benchmark-quick.yml"
      - ".github/workflows/benchmark-full.yml"
      - ".github/workflows/benchmark-pages.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "benchmarks/**"
      - "README.md"
      - "crates/**"
      - "kernels/**"
      - "support/**"
      - "tools/**"
      - "tests/**"
      - "docs/**"
      - "docs/artifact-format.md"
      - "docs/benchmarks.md"
      - "docs/build-and-run.md"
      - "docs/performance.md"
      - "docs/supported-matrix.md"
      - "docs/testing.md"
      - "tools/check-active-docs.py"
      - "tools/check-kernel-groups.py"
      - "tools/check-pr-diff.py"
      - "tools/check-qwen38-artifacts.py"
      - "tools/check-retained-source-terms.py"
      - "tools/check-support-matrix.py"
      - "tools/check-tool-inventory.py"
      - "tools/parse-rocm-smi.py"
      - "tools/select-r9700-device.py"
      - "tools/supersonic-bench.py"
      - "tools/benchmark/**"
      - "tests/test_active_docs.py"
      - "tests/test_ci_workflows.py"
      - "tests/test_kernel_groups.py"
      - "tests/test_qwen38_artifact_preflight.py"
      - "tests/test_pr_diff.py"
      - "tests/test_r9700_helpers.py"
      - "tests/test_support_matrix.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU contract and compile gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      ROCM_VERSION: "7.2.4"
      ROCM_HIP_SDK_VERSION: "7.2.4.70204-93~24.04"
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install pinned ROCm HIP development toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gnupg wget
          sudo install -d -m 0755 /etc/apt/keyrings
          key_file="$RUNNER_TEMP/rocm.gpg.key"
          wget -qO "$key_file" https://repo.radeon.com/rocm/rocm.gpg.key
          key_fingerprint="$(gpg --show-keys --with-colons "$key_file" \
            | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$key_fingerprint" = "CA8BB4727A47B4D09B4EE8969386B48A1A693C5C"
          gpg --dearmor < "$key_file" \
            | sudo tee /etc/apt/keyrings/rocm.gpg >/dev/null
          sudo tee /etc/apt/sources.list.d/rocm.list >/dev/null <<EOF
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/rocm/apt/${ROCM_VERSION} noble main
          deb [arch=amd64 signed-by=/etc/apt/keyrings/rocm.gpg] https://repo.radeon.com/graphics/${ROCM_VERSION}/ubuntu noble main
          EOF
          sudo tee /etc/apt/preferences.d/rocm-pin-600 >/dev/null <<'EOF'
          Package: *
          Pin: release o=repo.radeon.com
          Pin-Priority: 600
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "rocm-hip-sdk=${ROCM_HIP_SDK_VERSION}"
          echo "/opt/rocm/bin" >> "$GITHUB_PATH"
          echo "ROCM_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "HIP_PATH=/opt/rocm" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/opt/rocm/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" \
            >> "$GITHUB_ENV"

      - name: Verify host tools and pinned HIP toolchain
        shell: bash
        run: |
          set -euo pipefail
          command -v git
          git --version
          command -v python3
          python3 --version
          python3 - <<'PY'
          import sys
          import tomllib

          if sys.version_info < (3, 11):
              raise SystemExit(f"Python >= 3.11 required, got {sys.version}")
          print(sys.version)
          print(f"tomllib={tomllib.__name__}")
          PY
          command -v hipcc
          hipcc --version
          command -v cargo
          cargo --version
          command -v rustfmt
          rustfmt --version

      - name: Check actual pull-request patch
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -n "${PR_BASE_SHA:-}"
            test -n "${PR_HEAD_SHA:-}"
            test -n "${PR_NUMBER:-}"
            git fetch --no-tags origin \
              "refs/pull/${PR_NUMBER}/head:refs/remotes/origin/pr-${PR_NUMBER}-head" \
              "$PR_BASE_SHA"
            python3 tools/check-pr-diff.py --base "$PR_BASE_SHA" --head "$PR_HEAD_SHA"
          else
            base="$(git merge-base HEAD^ HEAD)"
            python3 tools/check-pr-diff.py --base "$base" --head HEAD
          fi

      - name: Check Rust formatting
        run: cargo fmt --all --check

      # The HIP build scripts need a deterministic code-generation target, but
      # this job never selects or requires a GPU device.
      # Keep the retained Rust warning inventory actionable.  The HIP build
      # scripts select a deterministic arch above, and the all-target check
      # is currently warning-free, so deny Rust warnings at this gate rather
      # than hiding them with a global allow.
      - name: Compile every workspace target (warnings are errors)
        run: RUSTFLAGS="-D warnings" HIP_ARCH=gfx1201 cargo check --workspace --all-targets

      - name: GQH model-store tests
        run: HIP_ARCH=gfx1201 cargo test -p model-store --lib 'gqh::tests::' -- --nocapture

      - name: GQH kernel-FFI tests
        run: |
          HIP_ARCH=gfx1201 cargo test -p kernel-ffi --lib 'gqh::tests::maps_gguf_and_flm_ids' -- --nocapture
          HIP_ARCH=gfx1201 cargo test -p kernel-ffi --lib 'gqh::tests::register_and_lookup_header_by_pointer' -- --nocapture

      - name: MTP acceptance policy
        run: HIP_ARCH=gfx1201 cargo test -p supersonic-runtime --lib mtp_accept_tests -- --nocapture

      - name: CLI contract
        run: HIP_ARCH=gfx1201 cargo test -p runner --test qwen38_cli_contract -- --nocapture

      - name: Startup and artifact-role contract
        run: HIP_ARCH=gfx1201 cargo test -p runner --test qwen38_startup_contract -- --nocapture

      - name: Validate product manifests and retained source boundary
        run: |
          python3 tools/check-support-matrix.py
          python3 tools/check-kernel-groups.py
          python3 tools/check-tool-inventory.py
          python3 tools/check-retained-source-terms.py
          python3 tools/check-active-docs.py

      - name: Validate benchmark fixtures and render CPU-only site
        run: |
          python3 tools/supersonic-bench.py validate tests/benchmark_fixtures/valid-result-v1.json
          python3 tools/supersonic-bench.py render tests/benchmark_fixtures target/benchmarks/site-fixtures
          python3 -m unittest \
            tests.test_amd_smi_provenance \
            tests.test_benchmark_manifests \
            tests.test_benchmark_validation \
            tests.test_benchmark_render \
            tests.test_supersonic_bench_cli -v

      - name: Run CPU-safe Python validators
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
