name: Qwen3.8 GQH gfx1201

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/qwen38-gfx1201.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/**"
      - "kernels/**"
      - "support/**"
      - "tools/**"

permissions:
  contents: read

concurrency:
  group: benchmark-gfx1201-device-${{ github.repository }}
  cancel-in-progress: false

jobs:
  r9700:
    name: R9700 serial Qwen3.8 correctness gate
    runs-on: [self-hosted, linux, rocm, gfx1201]
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      HIP_ARCH: gfx1201
      # The canonical host currently exposes the R9700 as physical GPU 1.
      # Discovery below remains authoritative so a different runner layout
      # cannot silently select GPU zero.  An override is accepted only after
      # the same gfx1201 validation.
      SUPERSONIC_R9700_GPU_ID: ${{ vars.SUPERSONIC_R9700_GPU_ID }}
      SUPERSONIC_DEVICE: "0"
      RUST_TEST_THREADS: "1"
      SUPERSONIC_REQUIRE_GQH_ARTIFACTS: "1"
      # These are the canonical self-hosted runner paths.  Repository or
      # organization variables/secrets may point at an equivalent mounted
      # location without changing the Rust artifact contract.
      SUPERSONIC_GQH_GGUF: ${{ secrets.SUPERSONIC_GQH_GGUF || vars.SUPERSONIC_GQH_GGUF || '/home/deano/gqh-artifacts/qwen38-gqh-q2kxl-gptq.gguf' }}
      SUPERSONIC_GQH_8192_GGUF: ${{ secrets.SUPERSONIC_GQH_8192_GGUF || vars.SUPERSONIC_GQH_8192_GGUF || '/home/deano/gqh-artifacts/qwen38-gqh-q2kxl-gptq-8192.gguf' }}
      SUPERSONIC_QWEN38_MODEL_DIR: ${{ secrets.SUPERSONIC_QWEN38_MODEL_DIR || vars.SUPERSONIC_QWEN38_MODEL_DIR || '/data/models/Qwen3.8-27B' }}
      CI_OUTPUT_ROOT: target/ci/qwen38-gfx1201

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Discover and select R9700 physical device
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT"
          command -v amd-smi
          timeout --foreground 30s amd-smi static --asic --bus --json \
            | tee "$CI_OUTPUT_ROOT/amd-smi-static-asic-bus.json"
          timeout --foreground 30s amd-smi list -e --json \
            | tee "$CI_OUTPUT_ROOT/amd-smi-enumeration.json"
          python3 tools/merge-amd-smi-provenance.py \
            --asic-bus "$CI_OUTPUT_ROOT/amd-smi-static-asic-bus.json" \
            --enumeration "$CI_OUTPUT_ROOT/amd-smi-enumeration.json" \
            --output "$CI_OUTPUT_ROOT/amd-smi-provenance.json"
          selection="$(python3 tools/select-r9700-device.py \
            --input "$CI_OUTPUT_ROOT/amd-smi-provenance.json" \
            --override "${SUPERSONIC_R9700_GPU_ID:-}")"
          printf '%s\n' "$selection" | tee "$CI_OUTPUT_ROOT/device-selection.log"
          while IFS='=' read -r name value; do
            case "$name" in
              SUPERSONIC_R9700_GPU_ID|SUPERSONIC_R9700_GPU_ARCH|SUPERSONIC_GPU_IDENTITY|SUPERSONIC_GPU_IDENTITY_KIND|SUPERSONIC_GPU_LOGICAL|HIP_VISIBLE_DEVICES|SUPERSONIC_DEVICE)
                printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
                export "$name=$value"
                ;;
              *)
                echo "unexpected selector output: $name" >&2
                exit 1
                ;;
            esac
          done <<< "$selection"
          physical_gpu="$SUPERSONIC_R9700_GPU_ID"
          [[ "$HIP_VISIBLE_DEVICES" == "$physical_gpu" ]]
          [[ "$SUPERSONIC_DEVICE" == "0" ]]
          [[ -n "$SUPERSONIC_GPU_IDENTITY" ]]
          [[ "$SUPERSONIC_GPU_IDENTITY_KIND" == "pci_bdf" || "$SUPERSONIC_GPU_IDENTITY_KIND" == "uuid" ]]
          # AMD SMI's raw HIP ordinal is retained for provenance; HIP_VISIBLE_DEVICES
          # remaps the selected physical GPU to the runner-visible device 0.
          [[ "$SUPERSONIC_GPU_LOGICAL" =~ ^[0-9]+$ ]]
          timeout --foreground 30s rocm-smi -d "$physical_gpu" \
            --showproductname --showuse --showmemuse --showtemp \
            | tee "$CI_OUTPUT_ROOT/rocm-smi-initial.txt"

      - name: Capture ROCm and HIP toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          command -v hipcc
          timeout --foreground 30s hipcc --version \
            | tee "$CI_OUTPUT_ROOT/hipcc-version.txt"
          timeout --foreground 30s rocm-smi -d "$SUPERSONIC_R9700_GPU_ID" \
            --showdriverversion \
            | tee "$CI_OUTPUT_ROOT/rocm-driver-version.txt"

      - name: Wait for GPU idle
        shell: bash
        run: |
          set -euo pipefail
          max_wait_seconds=900
          interval_seconds=15
          required_idle_samples=3
          max_gpu_use_percent=10
          max_vram_use_percent=20
          idle_samples=0
          deadline=$(( $(date +%s) + max_wait_seconds ))
          physical_gpu="${SUPERSONIC_R9700_GPU_ID:?device selection did not export a physical GPU}"
          while :; do
            now="$(date +%s)"
            if (( now >= deadline )); then
              echo "timed out waiting for GPU ${physical_gpu} idle after ${max_wait_seconds}s" >&2
              exit 1
            fi
            remaining=$((deadline - now))
            probe_timeout=$(( remaining < 30 ? remaining : 30 ))
            probe_file="$CI_OUTPUT_ROOT/rocm-smi-idle-${now}.txt"
            timeout --foreground "${probe_timeout}s" rocm-smi -d "$physical_gpu" \
              --showuse --showmemuse --showtemp \
              | tee "$probe_file"
            utilization="$(python3 tools/parse-rocm-smi.py --input "$probe_file")"
            gpu_use="$(awk '{for (i=1; i<=NF; i++) if ($i ~ /^gpu_use_percent=/) {sub(/^[^=]*=/, "", $i); print $i}}' <<< "$utilization")"
            vram_use="$(awk '{for (i=1; i<=NF; i++) if ($i ~ /^vram_use_percent=/) {sub(/^[^=]*=/, "", $i); print $i}}' <<< "$utilization")"
            if awk -v gpu="$gpu_use" -v vram="$vram_use" \
              -v max_gpu="$max_gpu_use_percent" -v max_vram="$max_vram_use_percent" \
              'BEGIN { exit !(gpu <= max_gpu && vram <= max_vram) }'; then
              idle_samples=$((idle_samples + 1))
              echo "GPU idle sample ${idle_samples}/${required_idle_samples}: gpu=${gpu_use}% vram=${vram_use}%"
            else
              idle_samples=0
              echo "GPU busy: gpu=${gpu_use}% vram=${vram_use}%; waiting ${interval_seconds}s"
            fi
            if (( idle_samples >= required_idle_samples )); then
              echo "GPU has been idle for ${required_idle_samples} consecutive samples"
              break
            fi
            now="$(date +%s)"
            remaining=$((deadline - now))
            (( remaining > 0 )) || { echo "GPU idle deadline expired" >&2; exit 1; }
            sleep_for=$(( interval_seconds < remaining ? interval_seconds : remaining ))
            sleep "$sleep_for"
          done

      - name: Strict canonical artifact preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check-qwen38-artifacts.py --require-8192 \
            2>&1 | tee "$CI_OUTPUT_ROOT/artifact-preflight.log"

      - name: Build release workspace
        shell: bash
        run: |
          set -euo pipefail
          HIP_ARCH=gfx1201 cargo build --release --workspace \
            2>&1 | tee "$CI_OUTPUT_ROOT/release-build.log"

      # A 10+ GiB artifact is resident during these tests.  Keep every cargo
      # invocation serial and include ignored correctness gates explicitly.
      - name: Focused GQH kernel tests
        shell: bash
        run: |
          set -euo pipefail
          RUST_TEST_THREADS=1 cargo test --release -p kernel-ffi --lib 'gqh::tests::' \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$CI_OUTPUT_ROOT/gqh-kernel-tests.log"

      - name: Full canonical GQH artifact crawl
        shell: bash
        run: |
          set -euo pipefail
          RUST_TEST_THREADS=1 cargo test --release -p qwen38 --test qwen38_gqh_gguf_crawl \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$CI_OUTPUT_ROOT/gqh-artifact-crawl.log"

      - name: Deterministic decode and chat generation
        shell: bash
        run: |
          set -euo pipefail
          RUST_TEST_THREADS=1 cargo test --release -p supersonic-runtime --test qwen38_gqh_decode_rung11 \
            -- --include-ignored --test-threads=1 --nocapture \
            2>&1 | tee "$CI_OUTPUT_ROOT/decode-chat-tests.log"

      - name: Ordinary versus MTP token equivalence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CI_OUTPUT_ROOT/token-equivalence"
          common_args=(
            --model qwen3.8-27b
            --model-dir "$SUPERSONIC_QWEN38_MODEL_DIR"
            --gguf-file "$SUPERSONIC_GQH_GGUF"
            --chat
            --max-new-tokens 8
            --ignore-eos
            --emit-generated-json
            --emit-stage-timings
            --device 0
          )
          ./target/release/supersonic "${common_args[@]}" \
            > "$CI_OUTPUT_ROOT/token-equivalence/ordinary.log" 2>&1
          ./target/release/supersonic "${common_args[@]}" --speculative-decode \
            > "$CI_OUTPUT_ROOT/token-equivalence/mtp.log" 2>&1
          python3 tools/qwen38-reproducibility.py compare \
            --ordinary "$CI_OUTPUT_ROOT/token-equivalence/ordinary.log" \
            --mtp "$CI_OUTPUT_ROOT/token-equivalence/mtp.log" \
            --output "$CI_OUTPUT_ROOT/token-equivalence/comparison.json"

      # Retain this legacy diagnostic until benchmark-quick records expose
      # complete parity with warmup_runs, measured_runs, and ms_per_tok.  It
      # is deliberately not a publication path and remains separate from the
      # validated benchmark candidate artifacts.
      - name: Legacy throughput telemetry (diagnostic only)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -u
          telemetry_root="$CI_OUTPUT_ROOT/throughput"
          mkdir -p "$telemetry_root"
          common_args=(
            --model qwen3.8-27b
            --model-dir "$SUPERSONIC_QWEN38_MODEL_DIR"
            --gguf-file "$SUPERSONIC_GQH_GGUF"
            --prompt "Hello"
            --chat
            --max-new-tokens 8
            --ignore-eos
            --emit-generated-json
            --emit-stage-timings
            --device 0
          )
          for warmup in 1; do
            ./target/release/supersonic "${common_args[@]}" \
              > "$telemetry_root/warmup-${warmup}.log" 2>&1 || exit $?
          done
          for run in 1 2 3; do
            ./target/release/supersonic "${common_args[@]}" \
              > "$telemetry_root/run-${run}.log" 2>&1 || exit $?
          done
          python3 - "$telemetry_root" "$telemetry_root/summary.json" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          values = []
          for path in sorted(root.glob("run-*.log")):
              text = path.read_text(encoding="utf-8")
              matches = re.findall(r"ms_per_tok=([0-9]+(?:\.[0-9]+)?)", text)
              if not matches:
                  raise SystemExit(f"no ms_per_tok telemetry in {path}")
              values.append(float(matches[-1]))
          values.sort()
          median_ms = values[len(values) // 2]
          summary = {
              "warmup_runs": 1,
              "measured_runs": len(values),
              "ms_per_tok": values,
              "median_ms_per_tok": median_ms,
              "median_tok_per_s": 1000.0 / median_ms if median_ms > 0 else 0.0,
              "blocking": False,
          }
          Path(sys.argv[2]).write_text(json.dumps(summary, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Write safe reproducibility record
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/qwen38-reproducibility.py record \
            --commit "$(git rev-parse HEAD)" \
            --hip-version-file "$CI_OUTPUT_ROOT/hipcc-version.txt" \
            --rocm-version-file "$CI_OUTPUT_ROOT/rocm-driver-version.txt" \
            --gpu-json "$CI_OUTPUT_ROOT/amd-smi-provenance.json" \
            --physical-gpu "$SUPERSONIC_R9700_GPU_ID" \
            --gpu-arch "$SUPERSONIC_R9700_GPU_ARCH" \
            --artifact "$SUPERSONIC_GQH_GGUF" \
            --model-dir "$SUPERSONIC_QWEN38_MODEL_DIR" \
            --ordinary "$CI_OUTPUT_ROOT/token-equivalence/ordinary.log" \
            --mtp "$CI_OUTPUT_ROOT/token-equivalence/mtp.log" \
            --telemetry-root "$CI_OUTPUT_ROOT/throughput" \
            --prompt "Hello" \
            --chat \
            --max-new-tokens 8 \
            --output "$CI_OUTPUT_ROOT/reproducibility.json"

      - name: Upload structured R9700 logs and artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qwen38-gfx1201-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/ci/qwen38-gfx1201
          if-no-files-found: warn
