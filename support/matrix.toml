# Active public product lanes.  Every row is the direct custom GQH GGUF
# Qwen3.8-27B path; internal FLM foundations are not a support lane.

version = 1

[[entry]]
id = "hip-gfx1100-qwen38-27b-gqh"
backend = "hip"
arch = "gfx1100"
status = "experimental"
models = ["qwen3.8-27b"]
model_sources = ["gqh-gguf"]
quants = ["gqh"]
correctness_gate = "qwen38-gqh-correctness"
support_doc = "docs/supported-matrix.md#hip-on-gfx1100"
gate_commands = [
  "SUPERSONIC_REQUIRE_GQH_ARTIFACTS=1 python3 tools/check-qwen38-artifacts.py --require-8192",
  "SUPERSONIC_REQUIRE_GQH_ARTIFACTS=1 RUST_TEST_THREADS=1 cargo test --release -p qwen38 --test qwen38_gqh_gguf_crawl -- --include-ignored --test-threads=1",
]
notes = "Qwen3.8-27B custom GQH GGUF lane on gfx1100."

[[entry]]
id = "hip-gfx1201-qwen38-27b-gqh"
backend = "hip"
arch = "gfx1201"
status = "experimental"
models = ["qwen3.8-27b"]
model_sources = ["gqh-gguf"]
quants = ["gqh"]
correctness_gate = "qwen38-gqh-correctness"
support_doc = "docs/supported-matrix.md#hip-on-gfx1201"
gate_commands = [
  "SUPERSONIC_REQUIRE_GQH_ARTIFACTS=1 python3 tools/check-qwen38-artifacts.py --require-8192",
  "SUPERSONIC_REQUIRE_GQH_ARTIFACTS=1 RUST_TEST_THREADS=1 cargo test --release -p qwen38 --test qwen38_gqh_gguf_crawl -- --include-ignored --test-threads=1",
  "SUPERSONIC_REQUIRE_GQH_ARTIFACTS=1 RUST_TEST_THREADS=1 cargo test --release -p supersonic-runtime --test qwen38_gqh_decode_rung11 mtp_i8 -- --ignored --test-threads=1 --nocapture",
]
notes = "Qwen3.8-27B custom GQH GGUF lane on the R9700 gfx1201 runner; int8 dp4a serving is on by default and declines unrepresentable grids, NextN/MTP retains ordinary-vs-int8 token equality, and DFlash2 uses semantic quality."
